<!DOCTYPE html>
<html>

<head>
    <title>API Tester</title>
</head>

<body>
    <h1>API Test Panel</h1>

    <!-- PRODUCTS -->
    <h2>Products</h2>

    <button onclick="getAllProducts()">Get All Products</button>
    <button onclick="getProductById()">Get Product by ID</button>
    <button onclick="createProduct()">Create Product</button>
    <button onclick="editProduct()">Edit Product</button>
    <button onclick="deleteProduct()">Delete Product</button>

    <!-- ORDERS -->
    <h2>Orders</h2>

    <button onclick="getAllOrders()">Get All Orders</button>
    <button onclick="getOrderById()">Get Order by ID</button>
    <button onclick="createOrder()">Create Order</button>
    <button onclick="editOrder()">Edit Order</button>
    <button onclick="deleteOrder()">Delete Order</button>

    <script>
        const base = "http://localhost:3000";

        // PRODUCTS
        async function getAllProducts() {
            console.log(await fetch(base + "/products").then(r => r.json()));
        }

        async function getProductById() {
            const id = prompt("Enter product ID:");
            console.log(await fetch(base + "/products/" + id).then(r => r.json()));
        }

        async function createProduct() {
            const body = {
                name: prompt("Name:"),
                price: Number(prompt("Price:"))
            };
            console.log(await fetch(base + "/products", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            }).then(r => r.json()));
        }

        async function editProduct() {
            const id = prompt("Enter product ID:");
            const body = { name: prompt("New name:") };
            console.log(await fetch(base + "/products/" + id, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            }).then(r => r.json()));
        }

        async function deleteProduct() {
            const id = prompt("Enter product ID:");
            console.log(await fetch(base + "/products/" + id, {
                method: "DELETE"
            }).then(r => r.json()));
        }

        // ORDERS
        async function getAllOrders() {
            console.log(await fetch(base + "/orders").then(r => r.json()));
        }

        async function getOrderById() {
            const id = prompt("Enter order ID:");
            console.log(await fetch(base + "/orders/" + id).then(r => r.json()));
        }

        async function createOrder() {
            const body = {
                productId: prompt("Product ID:"),
                quantity: Number(prompt("Quantity:"))
            };
            console.log(await fetch(base + "/orders", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            }).then(r => r.json()));
        }

        async function editOrder() {
            const id = prompt("Order ID:");
            const body = { status: prompt("New Status:") };
            console.log(await fetch(base + "/orders/" + id, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            }).then(r => r.json()));
        }

        async function deleteOrder() {
            const id = prompt("Order ID:");
            console.log(await fetch(base + "/orders/" + id, {
                method: "DELETE"
            }).then(r => r.json()));
        }
    </script>

</body>

</html>
